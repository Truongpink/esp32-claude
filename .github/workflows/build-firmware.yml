name: Build ChatAI TPIOS OTA firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ESP32-S3 OTA firmware
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read firmware version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < firmware/VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid firmware/VERSION: $VERSION"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building ChatAI TPIOS v$VERSION OTA"

      - name: Prepare pinned XiaoZhi source and ChatAI overlay
        run: python3 scripts/prepare_upstream.py

      - name: Build application-only OTA image with ESP-IDF 6.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: xiaozhi-src
          command: idf.py reconfigure && python3 ../scripts/patch_wifi_portal.py && idf.py reconfigure && idf.py build

      - name: Copy application image with firmware version
        run: sudo install -m 0644 xiaozhi-src/build/xiaozhi.bin "ChatAI-TPIOS-v${{ steps.version.outputs.value }}-OTA.bin"

      - name: Upload OTA application image
        uses: actions/upload-artifact@v4
        with:
          name: ChatAI-TPIOS-v${{ steps.version.outputs.value }}-OTA
          path: ChatAI-TPIOS-v${{ steps.version.outputs.value }}-OTA.bin
          if-no-files-found: error
          retention-days: 14
