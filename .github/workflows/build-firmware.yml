name: Build ChatAI TPIOS OTA firmware

on:
  workflow_dispatch:

concurrency:
  group: firmware-build-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ESP32-S3 OTA firmware
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read firmware build number
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < firmware/VERSION)"
          if [[ ! "$VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid firmware/VERSION: $VERSION"
            exit 1
          fi
          NEXT_VERSION=$((VERSION + 1))
          echo "current=$VERSION" >> "$GITHUB_OUTPUT"
          echo "value=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building chatai-esp32-$NEXT_VERSION"

      - name: Prepare pinned XiaoZhi source and ChatAI overlay
        run: python3 scripts/prepare_upstream.py

      - name: Restore ESP-IDF managed component cache
        uses: actions/cache@v4
        with:
          path: xiaozhi-src/managed_components
          key: esp32s3-idf-6.1-managed-${{ hashFiles('xiaozhi-src/main/idf_component.yml') }}

      - name: Restore ESP-IDF compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: esp32s3-idf-6.1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            esp32s3-idf-6.1-${{ runner.os }}-

      - name: Build application-only OTA image with ESP-IDF 6.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: xiaozhi-src
          extra_docker_args: -v ${{ github.workspace }}/.ccache:/root/.ccache -e CCACHE_DIR=/root/.ccache -e IDF_CCACHE_ENABLE=1 -e CCACHE_MAXSIZE=500M
          command: idf.py reconfigure && python3 ../scripts/patch_wifi_portal.py && idf.py reconfigure && idf.py build && ccache -s

      - name: Copy application image with build number
        run: sudo install -m 0644 xiaozhi-src/build/xiaozhi.bin "chatai-esp32-${{ steps.version.outputs.value }}.bin"

      - name: Upload OTA application image
        uses: actions/upload-artifact@v4
        with:
          name: chatai-esp32-${{ steps.version.outputs.value }}
          path: chatai-esp32-${{ steps.version.outputs.value }}.bin
          if-no-files-found: error
          retention-days: 90

      - name: Save version after successful build
        run: |
          CURRENT_VERSION="${{ steps.version.outputs.current }}"
          NEXT_VERSION="${{ steps.version.outputs.value }}"
          VERSION_ON_DISK="$(tr -d '[:space:]' < firmware/VERSION)"
          if [[ "$VERSION_ON_DISK" != "$CURRENT_VERSION" ]]; then
            echo "firmware/VERSION changed during build; refusing to overwrite"
            exit 1
          fi
          printf '%s\n' "$NEXT_VERSION" > firmware/VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/VERSION
          git commit -m "Bump firmware release to version $NEXT_VERSION"
          git push origin HEAD:main
