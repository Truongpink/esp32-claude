name: Build ChatAI TPIOS standalone firmware

on:
  workflow_dispatch:

concurrency:
  group: chatai-tpios-standalone-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ESP32-S3 standalone firmware
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record checked-out main commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "Building main commit: ${source_sha}"

      - name: Determine next firmware Build Number
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' > /tmp/chatai-release-tags.txt
          latest_build="$(python3 - /tmp/chatai-release-tags.txt <<'PY'
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as tags_file:
              numbers = [
                  int(match.group(1))
                  for tag in tags_file
                  if (match := re.fullmatch(r"build-([0-9]+)", tag.strip()))
              ]

          print(max(numbers, default=0))
          PY
          )"
          build_number=$((latest_build + 1))
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "tag=build-${build_number}" >> "$GITHUB_OUTPUT"
          echo "Firmware Build Number: #${build_number}"

      - name: Build standalone firmware with ESP-IDF 6.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: firmware/standalone
          command: export CHATAI_FIRMWARE_BUILD=${{ steps.version.outputs.build_number }} && idf.py reconfigure && idf.py build

      - name: Package and verify firmware
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_bin="firmware/standalone/build/ChatAI_TPIOS.bin"
          test -s "$source_bin"
          magic="$(od -An -tx1 -N1 "$source_bin" | tr -d ' \\n')"
          if [[ "$magic" != "e9" ]]; then
            echo "The output is not an ESP application image (expected image magic E9)."
            exit 1
          fi
          size="$(stat -c '%s' "$source_bin")"
          max_size=$((0x3F0000))
          if (( size > max_size )); then
            echo "Firmware size $size exceeds OTA slot limit $max_size."
            exit 1
          fi
          mkdir -p firmware/dist
          bin_name="ChatAI-TPIOS-${BUILD_NUMBER}.bin"
          zip_name="ChatAI-TPIOS-${BUILD_NUMBER}.zip"
          cp "$source_bin" "firmware/dist/$bin_name"
          (cd firmware/dist && zip -q "$zip_name" "$bin_name")
          unzip -t "firmware/dist/$zip_name"
          mapfile -t zip_entries < <(unzip -Z1 "firmware/dist/$zip_name")
          if (( ${#zip_entries[@]} != 1 )) || [[ "${zip_entries[0]}" != "$bin_name" ]]; then
            echo "ZIP must contain exactly $bin_name."
            exit 1
          fi
          test -s "firmware/dist/$bin_name"
          test -s "firmware/dist/$zip_name"
          echo "Verified $bin_name and $zip_name ($size / $max_size bytes)."
          echo "Source main commit: ${SOURCE_SHA}"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChatAI-TPIOS-${{ steps.version.outputs.build_number }}
          path: firmware/dist/ChatAI-TPIOS-${{ steps.version.outputs.build_number }}.bin
          if-no-files-found: error
          retention-days: 30

      - name: Publish official firmware release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh release create "build-${BUILD_NUMBER}" \
            "firmware/dist/ChatAI-TPIOS-${BUILD_NUMBER}.bin" \
            "firmware/dist/ChatAI-TPIOS-${BUILD_NUMBER}.zip" \
            --title "ChatAI TPIOS Firmware Build #${BUILD_NUMBER}" \
            --notes "Official ChatAI TPIOS ESP32-S3 application firmware. OTA image only; no bootloader or partition table. Source main commit: ${SOURCE_SHA}."
