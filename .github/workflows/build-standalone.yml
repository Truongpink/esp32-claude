name: Build ChatAI TPIOS standalone firmware

on:
  workflow_dispatch:

concurrency:
  group: chatai-tpios-standalone-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ESP32-S3 standalone firmware
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build standalone firmware with ESP-IDF 6.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: firmware/standalone
          command: idf.py reconfigure && idf.py build

      - name: Verify application firmware
        shell: bash
        run: |
          set -euo pipefail
          test -s firmware/standalone/build/ChatAI_TPIOS.bin
          size="$(stat -c '%s' firmware/standalone/build/ChatAI_TPIOS.bin)"
          max_size=$((0x3F0000))
          if (( size > max_size )); then
            echo "Firmware size $size exceeds the 16 MB OTA slot limit $max_size."
            exit 1
          fi
          echo "ChatAI_TPIOS.bin is present and fits the OTA application slot ($size / $max_size bytes)."

      - name: Upload application firmware only
        uses: actions/upload-artifact@v4
        with:
          name: ChatAI_TPIOS
          path: firmware/standalone/build/ChatAI_TPIOS.bin
          if-no-files-found: error
          retention-days: 30
