name: Build ChatAI TPIOS standalone firmware

on:
  workflow_dispatch:

concurrency:
  group: chatai-tpios-standalone-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ESP32-S3 standalone firmware
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Determine next firmware Build Number
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' > /tmp/chatai-release-tags.txt
          latest_build="$(python3 - /tmp/chatai-release-tags.txt <<'PY'
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as tags_file:
              numbers = [
                  int(match.group(1))
                  for tag in tags_file
                  if (match := re.fullmatch(r"build-([0-9]+)", tag.strip()))
              ]

          print(max(numbers, default=0))
          PY
          )"
          build_number=$((latest_build + 1))
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "tag=build-${build_number}" >> "$GITHUB_OUTPUT"
          echo "Firmware Build Number: #${build_number}"

      - name: Build standalone firmware with ESP-IDF 6.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: firmware/standalone
          command: export CHATAI_FIRMWARE_BUILD=${{ steps.version.outputs.build_number }} && idf.py reconfigure && idf.py build

      - name: Verify application firmware
        shell: bash
        run: |
          set -euo pipefail
          test -s firmware/standalone/build/ChatAI_TPIOS.bin
          size="$(stat -c '%s' firmware/standalone/build/ChatAI_TPIOS.bin)"
          max_size=$((0x3F0000))
          if (( size > max_size )); then
            echo "Firmware size $size exceeds the 16 MB OTA slot limit $max_size."
            exit 1
          fi
          echo "ChatAI_TPIOS.bin is present and fits the OTA application slot ($size / $max_size bytes)."

      - name: Upload application firmware only
        uses: actions/upload-artifact@v4
        with:
          name: ChatAI_TPIOS
          path: firmware/standalone/build/ChatAI_TPIOS.bin
          if-no-files-found: error
          retention-days: 30

      - name: Publish official firmware release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          gh release create "build-${BUILD_NUMBER}" \
            firmware/standalone/build/ChatAI_TPIOS.bin \
            --title "ChatAI TPIOS Firmware Build #${BUILD_NUMBER}" \
            --notes "Official ChatAI TPIOS application firmware for ESP32-S3. OTA image only; no bootloader or partition table."
